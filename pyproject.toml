[project]
name = "ac-event-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.40,<2",
    "jsonschema>=4.23,<5",
    "duckdb>=1.4,<2",
    "pytz>=2025.2",
    "scipy==1.17.1",
    "numpy==2.5.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
